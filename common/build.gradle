// common: de-obfuscated vanilla Minecraft via NeoForm (no loader APIs here).
// ModDevGradle in "NeoForm-only" mode (neoFormVersion without a NeoForge version)
// gives official-named vanilla classes to compile shared code against. This
// module's source is also pulled into :fabric and :neoforge (one copy, no drift).

plugins {
    id 'net.neoforged.moddev'
}

def mc = rootProject.minecraft_version

neoForge {
    // De-obfuscated vanilla base; 26.2 NeoForm is published (26.2-1).
    neoFormVersion = project.findProperty("neo_form_version_${mc}")

    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

dependencies {
    // Sentry error-reporting SDK (telemetry/NeroPowerTelemetry, Stage 9). Compile-only here for IDE
    // parity; each loader node puts it on the real classpath and embeds it (include / jarJar).
    // Privacy: opt-out config + neropower-only filter + no PII (PRIVACY.md). Dependency-free artifact.
    compileOnly 'io.sentry:sentry:8.45.0'

    // Neroland Core + NeroTech are NOT declared here, exactly as in NeroTech's common build: `common`
    // is not a Gradle project (settings.gradle only creates the nine Stonecutter loader nodes) — its
    // source is spliced into every node, and each node's build.gradle puts the per-loader Core and
    // NeroTech artifacts (nerolandcore-<loader>-<mc>, nerotech-<loader>-<mc>) on the compile classpath.
    // The shared source therefore resolves za.co.neroland.nerolandcore.* and za.co.neroland.nerotech.*
    // through whichever node compiles it; keep loader imports out of common/ regardless.
}
